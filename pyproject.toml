[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scamcheck"
version = "0.1.0"
description = "An agentic scam/phishing message checker for Malaysia that verifies claims with real tool calls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["security", "phishing", "scam", "agent", "tool-use", "claude", "mcp", "malaysia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tldextract>=5.1",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
scamcheck = "scamcheck.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scamcheck = ["data/*.json"]

[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101", "E501"]  # line length is owned by `ruff format`; long strings are allowed

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
