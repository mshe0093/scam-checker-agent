# Render Blueprint: one free web service that serves the API and the web UI.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository. See docs/deploy.md.
services:
  - type: web
    name: scamcheck
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # rules = the free offline rules engine. Set to auto (and add ANTHROPIC_API_KEY) to use the
      # Claude agent instead.
      - key: SCAMCHECK_ENGINE
        value: rules
      # On Render, X-Forwarded-For arrives as "<client-supplied...>, <real client>, <Cloudflare
      # edge>, <Render load balancer>" (observed 2026-11-11), so the real client is 3 from the
      # right. Anything further left can be forged.
      - key: SCAMCHECK_TRUST_PROXY
        value: "1"
      - key: SCAMCHECK_PROXY_HOPS
        value: "3"
      # Shown in the forwardable summary so recipients can check their own messages.
      - key: SCAMCHECK_PUBLIC_URL
        value: https://scamcheck-4afb.onrender.com
      # Optional secrets: set them in the dashboard, never in this file.
      # Telegram bot (docs/deploy.md): both must be set for /api/telegram/webhook to exist.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
