name: Wrong verdict
description: A scam we missed, or a genuine message we flagged
title: "[Wrong verdict] "
labels: ["wrong-verdict"]
body:
  - type: markdown
    attributes:
      value: |
        **Remove personal details first.** That includes names, account and IC numbers, phone numbers that aren't the scammer's, and any TAC/OTP code. Replace them with placeholders like `[NAME]`.
  - type: textarea
    id: message
    attributes:
      label: The message (with personal details removed)
      render: text
    validations:
      required: true
  - type: dropdown
    id: truth
    attributes:
      label: What it really is
      options:
        - A scam
        - A genuine message
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: got
    attributes:
      label: What Scam Checker said
      options:
        - likely_scam
        - suspicious
        - likely_legitimate
        - insufficient_information
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - Rules engine (no AI)
        - Claude agent
        - Not sure
  - type: textarea
    id: why
    attributes:
      label: How do you know?
      description: For example, the bank confirmed it, or the link went to a fake login page.
